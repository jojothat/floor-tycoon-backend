# Game + backend + database, and an end-to-end test that plays one game through them.
#   docker compose up --build web api db                 → play at http://localhost:8080
#   docker compose --profile test run --rm e2e           → scripted full play, exit 0 = pass
#   docker compose --profile mock up --build web mock    → game against the mock API (no backend needed)
# "api" is the real backend from ../ (repo root): its Dockerfile, listening on 8000.
# Behind a TLS-inspecting proxy, set EXTRA_CA_FILE so the backend image can install packages.
services:
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["8080:80"]
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
      FT_PILOT_TOKEN: ${FT_PILOT_TOKEN:-dev-pilot}
      FT_GAME_VERSION: ${FT_GAME_VERSION:-dev}
      FT_SIM_MS: ${FT_SIM_MS:-20000}

  api:
    # The backend (repo root). It creates its tables and the dev pilot for FT_PILOT_TOKEN on start.
    build:
      context: ..
      dockerfile: Dockerfile
      secrets: [extra_ca]
    environment:
      DATABASE_URL: postgresql+psycopg://ft:ft@db:5432/ft
      FT_PILOT_TOKEN: ${FT_PILOT_TOKEN:-dev-pilot}
      TRUST_PROXY: "true"          # behind the web container's nginx
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-dev-only}
    command: ["sh", "-c", "python -m app.db && python -m app.admin add-pilot dev dev-site \"$$FT_PILOT_TOKEN\" && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ft, POSTGRES_PASSWORD: ft, POSTGRES_DB: ft }
    volumes: [ftdb:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ft"]
      interval: 3s
      timeout: 3s
      retries: 20

  mock:
    profiles: [mock]
    build: { context: ., dockerfile: docker/mock-api.Dockerfile }
    networks: { default: { aliases: [api] } }

  e2e:
    profiles: [test]
    build: { context: ., dockerfile: docker/e2e.Dockerfile }
    environment: { BASE_URL: http://web }
    depends_on: [web]

volumes:
  ftdb:

secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-/dev/null}  # only behind a TLS-inspecting proxy; empty otherwise
