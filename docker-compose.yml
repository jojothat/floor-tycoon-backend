# Local Postgres for runs and tests, until the Korean-region host is chosen.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ft
      POSTGRES_DB: floor_tycoon
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
